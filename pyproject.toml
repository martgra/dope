[project]
name = "dope"
version = "0.1.0"
description = "A Python project"
authors = [{ name = "Martin Gran", email = "martgra@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "anytree>=2.13.0",
    "gitpython>=3.1.44",
    "httpx>=0.28.1",
    "platformdirs>=4.3.7",
    "pydantic>=2.11.3",
    "pydantic-ai>=2.51.0",
    "pydantic-core>=2.33.1",
    "pydantic-settings>=2.9.0",
    "pyyaml>=6.0.2",
    "questionary>=2.1.0",
    "rich>=14.0.0",
    "tenacity>=9.1.2",
    "typer>=0.15.3",
]

[project.urls]
Documentation = "https://github.com/martgra/dope/README.md"
Source = "https://github.com/martgra/dope"


[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "detect-secrets>=1.5.0",
    "prek>=0.3.0",
    "pylint>=4.0.4",
    "pysentry-rs>=0.3.14",
    "ruff>=0.14.13",
    "ty>=0.0.13",
    "vulture>=2.14",
]
test = [
    "faker>=37.1.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[tool.uv]
default-groups = [
    "dev",
    "test",
]

[project.scripts]
dope = "dope.cli.main:run_cli"

[tool.hatch.build.targets.sdist]
include = ["dope"]

[tool.hatch.build.targets.wheel]
include = ["dope"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
exclude = ["tests/*"]

[tool.ruff.lint]
extend-ignore = ["E203"]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "PERF", "PT", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"app/core/settings.py" = ["D101", "D102", "D103", "D104", "D105", "D106", "D107"]
"**/agents/*.py" = ["D417"]
"**/**/prompts.py" = ["E501"]
"**/cli/*.py" = ["D103"]
"app/models/internal.py" = ["D101", "D102", "D103", "D105"]

[tool.ruff.lint.isort]
known-first-party = ["dope"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pylint]
max-line-length = 100
disable = ["all"]
enable = [
  # cyclic imports and cross-file duplication
  "R0401",  # cyclic-import
  "R0801",  # duplicate-code

  # inheritance / interface contract
  "E0110",  # abstract-class-instantiated
  "E0202",  # method-hidden
  "W0221",  # arguments-differ
  "W0222",  # signature-differs
  "W0223",  # abstract-method
  "W0231",  # super-init-not-called
  "W0233",  # non-parent-init-called
  "W0236",  # invalid-overridden-method
  "W0237",  # arguments-renamed
  "W0239",  # overridden-final-method
  "W0240",  # subclassed-final-class
  "W0246",  # useless-parent-delegation
  "R0901",  # too-many-ancestors

  # cross-module type inference
  "E1101",  # no-member
  "E0611",  # no-name-in-module
  "E1102",  # not-callable
  "E1111",  # assignment-from-no-return
  "E1120",  # no-value-for-parameter
  "E1121",  # too-many-function-args
  "E1123",  # unexpected-keyword-arg
  "E1124",  # redundant-keyword-arg
  "E1128",  # assignment-from-none

  # deprecated API usage across modules
  "W4901",  # deprecated-module
  "W4902",  # deprecated-method
  "W4903",  # deprecated-argument
  "W4904",  # deprecated-class
  "W4905",  # deprecated-decorator
]


[tool.pylint.main]
ignore-paths = ["^tests/.*$"]

[tool.deptry]
known_first_party = ["dope"]

[tool.pytest]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dope"]

[tool.vulture]
make_whitelist = true
min_confidence = 80
paths = ["dope", "vulture_whitelist.py"]
sort_by_size = true
