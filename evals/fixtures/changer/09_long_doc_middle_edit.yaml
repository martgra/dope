existing_doc:
  path: docs/architecture.md
  content: |
    # Architecture

    ## Overview

    DOPE is a modular CLI split into consumers, services, and repositories.

    ## Consumers

    Consumers wrap file I/O — DocConsumer for markdown, GitConsumer for diffs.

    ## Services

    Services orchestrate LLM calls. The main services are:

    - Describer — turns files into structured summaries.
    - Suggester — turns summaries into doc suggestions.
    - Changer — applies suggestions to docs.
    - Scoper — analyzes project complexity.

    ## Repositories

    Repositories persist state (JSON on disk, currently).

    ## LLM Providers

    OpenAI and Azure are supported. See README for setup.

    ## State Directory

    All persistent state lives under `.dope/` in the project root.
