name: new_config_option
description: |
  Adds a new user-facing configuration setting exposed via env var.
  Must land in README (config section) and QUICKSTART (prerequisites/config).
docs_change:
  README.md:
    hash: r1
    summary:
      sections:
        - section_name: Configuration
          summary: Lists `.doperc.yaml` settings including scope_filter_settings block.
          references: [scope_filter_settings, min_relevance_score]
        - section_name: Environment Variables
          summary: Lists env vars including AGENT_TOKEN and OPENAI_API_KEY.
          references: [AGENT_TOKEN, OPENAI_API_KEY]
  QUICKSTART.md:
    hash: q1
