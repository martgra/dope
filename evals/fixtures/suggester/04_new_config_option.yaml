          references: [dope config init]
  CHANGELOG.md:
    hash: c1
    summary:
      sections:
        - section_name: Unreleased
          summary: Placeholder for pending changes.
          references: []
code_change:
  dope/models/settings.py:
    hash: s1
    priority: HIGH
    metadata:
      classification: HIGH
      magnitude: 0.35
      lines_added: 4
      lines_deleted: 0
    summary:
      specific_changes:
        - name: max_llm_concurrency
          summary: Adds a `max_llm_concurrency` field on ScopeFilterSettings, exposed via env var SCOPE_FILTER__MAX_LLM_CONCURRENCY.
      functional_impact:
        - Users can now cap parallel LLM calls per phase via env var or .doperc.yaml.
      programming_language: Python
      judgment:
        change_category: configuration
        change_type: add
        is_breaking: false
        is_user_facing: true
        needs_docs: true
