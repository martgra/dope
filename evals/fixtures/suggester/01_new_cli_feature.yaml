name: new_cli_feature
description: |
  New `audit` CLI command added. README needs to list it. CHANGELOG is a
  reasonable secondary target but not required. QUICKSTART should stay
  untouched (it isn't the CLI reference).
docs_change:
  README.md:
    hash: r1
    summary:
      sections:
        - section_name: Overview
          summary: DOPE is an AI-powered CLI for scanning code and docs.
          references: [dope]
        - section_name: Command Reference
          summary: Lists available CLI commands (init, scan, suggest, apply, update, status, scope, config).
          references: [dope init, dope scan, dope suggest, dope apply, dope update, dope status, dope scope, dope config]
  QUICKSTART.md:
    hash: q1
    summary:
      sections:
        - section_name: Prerequisites
          summary: Lists Python and API-key requirements.
          references: [Python 3.13, OPENAI_API_KEY]
        - section_name: Installation
          summary: Walks through pip install steps.
          references: [pip install .]
  CHANGELOG.md:
    hash: c1
    summary:
      sections:
        - section_name: Unreleased
          summary: Placeholder for pending changes.
          references: []
code_change:
  dope/cli/main.py:
    hash: m1
    priority: HIGH
    metadata:
      classification: HIGH
      magnitude: 0.5
      lines_added: 12
      lines_deleted: 0
    summary:
      specific_changes:
        - name: audit
          summary: Adds new `@app.command()` named `audit` that scans docs for staleness without a triggering diff.
      functional_impact:
        - New CLI command `dope audit` available for users to invoke.
      programming_language: Python
expected:
