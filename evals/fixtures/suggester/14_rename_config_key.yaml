name: rename_config_key
description: |
  Breaking rename of a `.doperc.yaml` key. Users have this in their local
  config files. README (Configuration) and CHANGELOG both required.
  Migration guide required (users need to update their configs).
docs_change:
  README.md:
    hash: r1
    summary:
      sections:
        - section_name: Configuration
          summary: Documents the .doperc.yaml keys including `scope_filter_settings.min_relevance_score`.
          references: [scope_filter_settings, min_relevance_score]
  CHANGELOG.md:
    hash: c1
    summary:
      sections:
        - section_name: Unreleased
          summary: Placeholder.
          references: []
  docs/migration.md:
    hash: m1
    summary:
      sections:
        - section_name: Recent Migrations
          summary: History of configuration renames and breaking changes.
          references: []
code_change:
  dope/models/settings.py:
    hash: s1
    priority: HIGH
    metadata:
      classification: HIGH
      magnitude: 0.3
      lines_added: 3
      lines_deleted: 3
    summary:
      specific_changes:
        - name: min_relevance_score
          summary: Renames the `min_relevance_score` config key to `relevance_threshold`. Old name removed, no alias.
      functional_impact:
        - Breaking - existing .doperc.yaml files with `min_relevance_score` will fail validation.
        - Users must edit their config to use `relevance_threshold`.
      programming_language: Python
      judgment:
        change_category: configuration
        change_type: change_existing
        is_breaking: true
        is_user_facing: true
        needs_docs: true
        doc_priority: 4
expected:
  suggestions:
    - documentation_file_path: README.md
      change_type: change_existing
    - documentation_file_path: CHANGELOG.md
      change_type: change_existing
    - documentation_file_path: docs/migration.md
      change_type: change_existing
