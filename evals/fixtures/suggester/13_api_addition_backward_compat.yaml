    summary:
      sections:
        - section_name: Overview
          summary: DOPE overview.
          references: [dope]
  CHANGELOG.md:
    hash: c1
    summary:
      sections:
        - section_name: Unreleased
          summary: Placeholder.
          references: []
  docs/api.md:
    hash: a1
    summary:
      sections:
        - section_name: Repositories
          summary: API reference for JsonStateRepository.load and load_legacy methods.
          references: [JsonStateRepository, load, load_legacy]
code_change:
  dope/repositories/json_state.py:
    hash: j1
    priority: HIGH
    metadata:
      classification: HIGH
      magnitude: 0.2
      lines_added: 8
      lines_deleted: 0
    summary:
      specific_changes:
        - name: load_partial
          summary: "New public method `load_partial(keys: list[str]) -> dict` on JsonStateRepository that returns a filtered subset of the state."
      functional_impact:
