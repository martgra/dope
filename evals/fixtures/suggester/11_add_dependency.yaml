name: add_dependency
description: |
  New runtime dependency plus a settings hook. README (Prerequisites) and
  QUICKSTART (Installation) both required. CHANGELOG optional.
docs_change:
  README.md:
    hash: r1
    summary:
      sections:
        - section_name: Prerequisites
          summary: Lists Python 3.13, git, and API-key requirements.
          references: [Python 3.13]
        - section_name: Installation
          summary: pip install .
          references: [pip install .]
  QUICKSTART.md:
    hash: q1
    summary:
      sections:
        - section_name: Prerequisites
          summary: Python 3.13, OPENAI_API_KEY.
          references: [OPENAI_API_KEY]
        - section_name: Installation
          summary: pip install -r requirements.txt then pip install .
          references: []
  CHANGELOG.md:
    hash: c1
    summary:
      sections:
        - section_name: Unreleased
          summary: Placeholder.
          references: []
code_change:
  pyproject.toml:
    hash: p1
    priority: HIGH
    metadata:
      classification: HIGH
      magnitude: 0.2
      lines_added: 1
      lines_deleted: 0
    summary:
      specific_changes:
        - name: dependency_addition
          summary: Adds `redis>=5.0` to project dependencies.
      functional_impact:
        - Installs will now include Redis client library.
        - Users deploying to environments without Redis available need to provide a connection URL.
      programming_language: TOML
      judgment:
        change_category: configuration
        change_type: add
        is_breaking: false
        is_user_facing: true
        needs_docs: true
        doc_priority: 3
  dope/models/settings.py:
    hash: s1
    priority: HIGH
    metadata:
      classification: HIGH
      magnitude: 0.15
      lines_added: 3
      lines_deleted: 0
    summary:
      specific_changes:
        - name: redis_url
          summary: "New `redis_url: str | None` field on Settings for the optional Redis connection."
      functional_impact:
        - Users may configure REDIS_URL to enable the cache backend.
      programming_language: Python
      judgment:
        change_category: configuration
        change_type: add
        is_breaking: false
        is_user_facing: true
        needs_docs: true
        doc_priority: 3
expected:
  suggestions:
    - documentation_file_path: README.md
      change_type: change_existing
    - documentation_file_path: QUICKSTART.md
      change_type: change_existing
    - documentation_file_path: CHANGELOG.md
      change_type: change_existing
      optional: true
