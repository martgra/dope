  change that a user might notice in an error message.
diff: |
  diff --git a/dope/services/suggester/suggester_service.py b/dope/services/suggester/suggester_service.py
  --- a/dope/services/suggester/suggester_service.py
  +++ b/dope/services/suggester/suggester_service.py
  @@ -180,7 +180,10 @@ class DocChangeSuggester:
