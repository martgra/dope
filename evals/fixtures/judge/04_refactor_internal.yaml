  no behavior change, no public API surface touched.
diff: |
  diff --git a/dope/core/doc_terms.py b/dope/core/doc_terms.py
  --- a/dope/core/doc_terms.py
  +++ b/dope/core/doc_terms.py
  @@ -60,12 +60,16 @@ class DocTermIndexBuilder:
