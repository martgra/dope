name: rename_public_function
description: |
  Renames a public function used by external callers. Structurally a refactor,
  but with breaking-API consequences.
diff: |
  diff --git a/dope/services/judge/__init__.py b/dope/services/judge/__init__.py
  --- a/dope/services/judge/__init__.py
  +++ b/dope/services/judge/__init__.py
  @@ -1,5 +1,5 @@
   """TypeSafe (Jev) judgments over code diffs."""

  -from dope.services.judge.judge_service import judge_diff
  +from dope.services.judge.judge_service import judge_code_diff as judge_diff

  -__all__ = ["judge_diff"]
  +__all__ = ["judge_code_diff"]
  diff --git a/dope/services/judge/judge_service.py b/dope/services/judge/judge_service.py
  --- a/dope/services/judge/judge_service.py
  +++ b/dope/services/judge/judge_service.py
  @@ -20,7 +20,7 @@ logger = logging.getLogger(__name__)


  -async def judge_diff(
  +async def judge_code_diff(
       diff: str,
       usage_tracker: UsageTracker | None = None,
   ) -> DiffJudgment:
expected:
  change_category: [api, refactor]
  change_type: change_existing
  is_breaking: true
  is_user_facing: true
  needs_docs: true
  doc_priority: 4
